<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SVG Shapes and Animation</title>
  <link rel="stylesheet" href="svg_styles">
</head>
<body>
  <h1>SVG Shapes and Animation</h1>

  <div class="shapes">
    <svg width="120" height="120">
      <rect x="10" y="10" width="100" height="100" fill="#f4d35e" stroke="#ee964b" stroke-width="5"></rect>
    </svg>

    <svg width="160" height="100">
      <rect x="10" y="10" width="140" height="80" fill="#90e0ef" stroke="#0077b6" stroke-width="5"></rect>
    </svg>

    <svg width="120" height="120">
      <circle cx="60" cy="60" r="50" fill="#c8e6c9" stroke="#2e7d32" stroke-width="5"></circle>
    </svg>

    <svg width="160" height="110">
      <ellipse class="animated-ellipse" cx="80" cy="55" rx="70" ry="45" fill="#f28482" stroke="#6a040f" stroke-width="5"></ellipse>
    </svg>
  </div>
</body>
</html>
