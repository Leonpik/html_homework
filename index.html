<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flexbox Layout</title>
  <link rel="stylesheet" href="flex-layout.css">
</head>
<body>
  <div class="row row1">
    <div class="box"></div>
    <div class="box"></div>
  </div>

  <div class="row row2">
    <div class="box"></div>
    <div class="group">
      <div class="box"></div>
      <div class="box"></div>
    </div>
  </div>

  <div class="row row3">
    <div class="group">
      <div class="box"></div>
      <div class="box"></div>
    </div>
    <div class="group">
      <div class="box"></div>
      <div class="box"></div>
    </div>
  </div>

  <div class="row row4">
    <div class="group push-right">
      <div class="box box-big"></div>
      <div class="stack">
        <div class="box box-small"></div>
        <div class="box box-small"></div>
      </div>
    </div>
  </div>

  <div class="row row5">
    <div class="group center">
      <div class="box box-big"></div>
      <div class="stack">
        <div class="box box-small"></div>
        <div class="box box-small"></div>
      </div>
    </div>
  </div>
</body>
</html>
